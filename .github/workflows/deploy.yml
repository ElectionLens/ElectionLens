name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

# One deploy at a time; do not cancel in-flight deploys (newer pushes queue).
# Cancelling the deploy job mid-flight surfaces as a failed "Deploy to GitHub Pages" step.
concurrency:
  group: pages
  cancel-in-progress: false

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ===========================================
  # Build for Deployment
  # ===========================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # deploy-pages POST /pages/deployments returns 404 until a Pages site exists with
      # build_type workflow. Provision or migrate via REST (pages: write).
      - name: Ensure GitHub Pages uses GitHub Actions (workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          HDR=(-H "Accept: application/vnd.github+json")

          # Some contexts (for example app/integration-scoped tokens) cannot create/update
          # repository Pages settings and return HTTP 403. In that case we proceed and rely on
          # repo-level Pages configuration being set once manually.
          set +e
          GET_ERR="$(mktemp)"
          gh api "repos/${REPO}/pages" "${HDR[@]}" -o /tmp/gh-pages-site.json 2>"${GET_ERR}"
          GET_RC=$?
          set -e
          GET_MSG="$(<"${GET_ERR}")"

          if [ "$GET_RC" -eq 0 ]; then
            BT="$(jq -r '.build_type // empty' /tmp/gh-pages-site.json)"
            if [ "$BT" = "workflow" ]; then
              echo "GitHub Pages already uses workflow builds."
              exit 0
            fi
            echo "Switching GitHub Pages to workflow builds (was: ${BT:-unknown})..."
            printf '%s' '{"build_type":"workflow"}' | gh api --method PUT "repos/${REPO}/pages" "${HDR[@]}" --input -
          elif [[ "${GET_MSG}" == *"Resource not accessible by integration"* || "${GET_MSG}" == *"HTTP 403"* ]]; then
            echo "Cannot manage Pages settings with this token (HTTP 403)."
            echo "Configure Pages once in repository settings: Build and deployment -> Source = GitHub Actions."
            echo "Continuing without automatic provisioning."
          else
            echo "Creating GitHub Pages site for workflow builds..."
            BODY="$(printf '{"build_type":"workflow","source":{"branch":"%s","path":"/"}}' "${BRANCH}")"
            set +e
            POST_ERR="$(mktemp)"
            printf '%s' "${BODY}" | gh api --method POST "repos/${REPO}/pages" "${HDR[@]}" --input - 2>"${POST_ERR}"
            POST_RC=$?
            set -e
            if [ "${POST_RC}" -ne 0 ]; then
              POST_MSG="$(<"${POST_ERR}")"
              if [[ "${POST_MSG}" == *"Resource not accessible by integration"* || "${POST_MSG}" == *"HTTP 403"* ]]; then
                echo "Cannot create Pages site with this token (HTTP 403)."
                echo "Configure Pages once in repository settings: Build and deployment -> Source = GitHub Actions."
                echo "Continuing without automatic provisioning."
                exit 0
              fi
              echo "POST failed (site may already exist); retrying PUT..."
              set +e
              PUT_ERR="$(mktemp)"
              printf '%s' '{"build_type":"workflow"}' | gh api --method PUT "repos/${REPO}/pages" "${HDR[@]}" --input - 2>"${PUT_ERR}"
              PUT_RC=$?
              set -e
              if [ "${PUT_RC}" -ne 0 ]; then
                PUT_MSG="$(<"${PUT_ERR}")"
                if [[ "${PUT_MSG}" == *"Resource not accessible by integration"* || "${PUT_MSG}" == *"HTTP 403"* ]]; then
                  echo "Cannot update Pages site with this token (HTTP 403)."
                  echo "Configure Pages once in repository settings: Build and deployment -> Source = GitHub Actions."
                  echo "Continuing without automatic provisioning."
                  exit 0
                fi
                echo "${PUT_MSG}"
                exit "${PUT_RC}"
              fi
            fi
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript type check
        run: npm run typecheck
      
      - name: Run tests
        run: npm run test:run
      
      - name: Build project
        run: npm run build
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # ===========================================
  # Deploy to GitHub Pages
  # ===========================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages-status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          HDR=(-H "Accept: application/vnd.github+json")
          set +e
          ERR_FILE="$(mktemp)"
          gh api "repos/${REPO}/pages" "${HDR[@]}" >/dev/null 2>"${ERR_FILE}"
          RC=$?
          set -e
          if [ "${RC}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSG="$(<"${ERR_FILE}")"
          if [[ "${MSG}" == *"HTTP 404"* || "${MSG}" == *"Not Found"* ]]; then
            echo "::warning::GitHub Pages is not enabled for this repository. Enable it once in Settings -> Pages -> Build and deployment -> Source = GitHub Actions."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "${MSG}"
          exit "${RC}"

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages-status.outputs.enabled == 'true'
        uses: actions/deploy-pages@v5
