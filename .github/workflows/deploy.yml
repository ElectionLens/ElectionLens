name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

# One deploy at a time; do not cancel in-flight deploys (newer pushes queue).
# Cancelling the deploy job mid-flight surfaces as a failed "Deploy to GitHub Pages" step.
concurrency:
  group: pages
  cancel-in-progress: false

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ===========================================
  # Build for Deployment
  # ===========================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # deploy-pages POST /pages/deployments returns 404 until a Pages site exists with
      # build_type workflow. Provision or migrate via REST (pages: write).
      - name: Ensure GitHub Pages uses GitHub Actions (workflow)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          HDR=(-H "Accept: application/vnd.github+json")
          if gh api "repos/${REPO}/pages" "${HDR[@]}" -o /tmp/gh-pages-site.json 2>/dev/null; then
            BT="$(jq -r '.build_type // empty' /tmp/gh-pages-site.json)"
            if [ "$BT" = "workflow" ]; then
              echo "GitHub Pages already uses workflow builds."
              exit 0
            fi
            echo "Switching GitHub Pages to workflow builds (was: ${BT:-unknown})..."
            printf '%s' '{"build_type":"workflow"}' | gh api --method PUT "repos/${REPO}/pages" "${HDR[@]}" --input -
          else
            echo "Creating GitHub Pages site for workflow builds..."
            BODY="$(printf '{"build_type":"workflow","source":{"branch":"%s","path":"/"}}' "${BRANCH}")"
            if ! printf '%s' "${BODY}" | gh api --method POST "repos/${REPO}/pages" "${HDR[@]}" --input -; then
              echo "POST failed (site may already exist); retrying PUT..."
              printf '%s' '{"build_type":"workflow"}' | gh api --method PUT "repos/${REPO}/pages" "${HDR[@]}" --input -
            fi
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript type check
        run: npm run typecheck
      
      - name: Run tests
        run: npm run test:run
      
      - name: Build project
        run: npm run build
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # ===========================================
  # Deploy to GitHub Pages
  # ===========================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
