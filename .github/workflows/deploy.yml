name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual triggers

# One deploy at a time; do not cancel in-flight deploys (newer pushes queue).
# Cancelling the deploy job mid-flight surfaces as a failed "Deploy to GitHub Pages" step.
concurrency:
  group: pages
  cancel-in-progress: false

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ===========================================
  # Build for Deployment
  # ===========================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript type check
        run: npm run typecheck
      
      - name: Run tests
        run: npm run test:run
      
      - name: Build project
        run: npm run build
      
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # ===========================================
  # Deploy to GitHub Pages
  # ===========================================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
