<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ElectionLens — UI revamp prototype</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
  </head>
  <body>
    <div class="app">
      <!-- MAP: the primary surface. Always present. -->
      <main class="map-wrap" aria-label="Constituency map">
        <div id="map"></div>
        <div class="map-badge" id="map-badge" aria-live="polite"></div>
      </main>

      <!-- PANEL: width follows navigation mode -->
      <aside class="panel" id="panel" aria-label="Results panel">
        <div class="sheet-handle" aria-hidden="true"></div>

        <div class="panel-header">
          <div class="brand">
            <h1>Election Lens</h1>
            <label class="sr-only" for="year-pick">Election year</label>
            <select class="year-pick" id="year-pick">
              <option value="2026">2026</option>
              <option value="2021" selected>2021</option>
              <option value="2016">2016</option>
              <option value="2011">2011</option>
            </select>
          </div>

          <div class="mode-switch" role="group" aria-label="Navigation mode">
            <button id="mode-map" aria-pressed="true">Map</button>
            <button id="mode-data" aria-pressed="false">Data</button>
          </div>
        </div>

        <nav class="breadcrumb" id="breadcrumb" aria-label="Breadcrumb"></nav>
        <div class="panel-body" id="panel-body"></div>
      </aside>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
